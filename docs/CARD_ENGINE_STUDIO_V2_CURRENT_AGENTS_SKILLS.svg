    .subtitle { font-size: 20px; fill: #40516f; }
    .head { font-size: 27px; font-weight: 700; }
    .item { font-size: 20px; }
    .note { font-size: 15px; fill: #52627b; }
    .footer { font-size: 16px; fill: #ffffff; }
    .panel { fill: #ffffff; stroke-width: 2; rx: 18; }
    .agent { stroke: #6651c6; }
    .skill { stroke: #12837a; }
    .row { fill: #f8fafc; stroke: #cad3e0; rx: 10; }
    .inactive { fill: #f1f4f8; stroke: #8995a7; }
    .retired { fill: #fff8e6; stroke: #c97913; }
