<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc">
  <title id="title">Card Engine AI Studio V2 installed agents and skills</title>
  <desc id="desc">A list of nine read-only specialist agents and twenty-three installed workflow skills, including inactive and retired workflows.</desc>
  <rect width="1600" height="1030" fill="#f8fafc"/>
