<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phaser Editor → Card Engine</title>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #0b0f0a;
        color: #e6d8b0;
        font: 15px/1.6 system-ui, sans-serif;
      }
      main { width: min(560px, 90vw); }
      h1 { font-size: 18px; margin: 0 0 4px; color: #fbbf24; }
      p { margin: 4px 0; }
      .muted { opacity: 0.55; font-size: 13px; }
      ul { list-style: none; padding: 0; margin: 18px 0 0; }
      li { margin: 0 0 8px; }
      a.scene {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        color: #e6d8b0;
        text-decoration: none;
      }
      a.scene:hover { background: rgba(251, 191, 36, 0.12); border-color: #fbbf24; }
      a.scene .when { opacity: 0.5; font-size: 13px; }
      a.scene.newest { border-color: #fbbf24; }
      a.scene.stale { opacity: 0.45; }
      code { color: #9ca3af; font-size: 13px; }
    </style>
  </head>
  <body>
    <!--
      This file exists so Phaser Editor's Play button works.

      Phaser Editor serves the PROJECT ROOT (this folder — it is where
      phasereditor2d.config.json lives) and opens "/". Before this file existed that
      showed a directory listing, because the actual game is a Vite/React app one
      level down in card-engine/, on its own port, with its own web root.

      Rather than build a second Phaser bootstrap up here — which would need its own
      copy of Phaser and would 404 on every asset, since every pack URL is relative
      to card-engine/public — this hands off to the app that already runs.

      TWO COMMANDS, TWO BEHAVIOURS:
      - "Preview Scene" (Ctrl+0) appends ?start=<SceneName>. That is honoured exactly.
      - "Play" sends nothing at all about which scene is open, so it CANNOT be told.
        Instead the most recently SAVED scene is opened, which is almost always the
        one just being worked on, and every scene is listed to switch in one click.
    -->
    <main>
      <h1 id="title">Opening…</h1>
      <p class="muted" id="sub"></p>
      <ul id="list"></ul>
      <p class="muted" id="help"></p>
    </main>

    <script>
      // The Editor's docs show the Preview URL as ".../start=Name" — i.e. the
      // parameter can arrive on the PATH rather than after a "?". Read both, or
      // Ctrl+0 on WildlifeLab would silently open CourtyardV2 instead.
      var pathMatch = location.pathname.match(/start=([A-Za-z_][A-Za-z0-9_]*)/);
      var params = new URLSearchParams(location.search);
      if (pathMatch && !params.get('start')) params.set('start', pathMatch[1]);

      /**
       * FIND THE DEV SERVER RATHER THAN ASSUME IT.
       *
       * This used to hardcode 5173 and tell you to pass ?port= when that was
       * wrong — which is a note to a human, on a button whose whole job is that
       * you press it and the game appears. Vite takes the next free port whenever
       * 5173 is busy, so "wrong port" is the ORDINARY case, not an edge one, and
       * the failure looks exactly like the server being down.
       *
       * So it asks. Every candidate is probed at once and the first to answer
       * wins; an explicit ?port= still short-circuits the search.
       */
      var CANDIDATE_PORTS = [5173, 5174, 5175, 5176, 5177, 5178, 5179, 5180, 5190];
      var forced = params.get('port');
      params.delete('port');
      var ports = forced ? [Number(forced)] : CANDIDATE_PORTS;
      var app = 'http://localhost:' + ports[0];

      /**
       * Which scene opens which page.
       *
       * `/dev/scene` draws a compiled scene and nothing else — no combat, no
       * camera, no rules — which was right when the editor held set dressing for a
       * top-down world that no longer exists. `CastleFrontWorld` is not set
       * dressing: it IS the side-view level, and the thing worth looking at is the
       * game running in it. Raheem, 2026-08-16: *"I just wanna be able to hit play,
       * and I wanna see my game running that I'm working on in the editor."*
       *
       * Anything else still falls through to the generic viewer.
       */
      var SCENE_ROUTES = { CastleFrontWorld: '/dev/castle-front-v4' };

      /** Set when more than one dev server answered, so the choice is visible. */
      var staleNote = '';

      function runUrl(name) {
        if (SCENE_ROUTES[name]) return app + SCENE_ROUTES[name];
        var p = new URLSearchParams(params);
        p.set('start', name);
        return app + '/dev/scene?' + p.toString();
      }

      /**
       * The candidate port serving the MOST RECENTLY SAVED scene.
       *
       * NOT the first one that answers, which is what this did and which was
       * wrong in a way that wasted an afternoon. More than one dev server is the
       * ordinary state here — an abandoned worktree left one on 5173 while the
       * live one ran on 5190 — and taking the first port in list order meant Play
       * always opened the stale one. Raheem, 2026-08-16: *"when I hit play, it
       * goes to an old version of the game, old version of the scene."* He had
       * just saved; the Editor had saved; the game he was shown was 1.4 hours old
       * and there was nothing on screen to say so.
       *
       * Freshness is the right tie-break because it is the thing he actually
       * means by "play my game": the server whose scene file was written last is
       * the one he is working in. Port numbers carry no such meaning.
       */
      function findApp() {
        return Promise.all(
          ports.map(function (candidate) {
            var base = 'http://localhost:' + candidate;
            return fetch(base + '/editor-scenes/index.json')
              .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
              .then(function (scenes) { return { base: base, scenes: scenes }; })
              .catch(function () { return null; });
          }),
        ).then(function (results) {
          var live = results.filter(Boolean).filter(function (r) { return r.scenes.length; });
          if (!live.length) throw new Error('no dev server');
          var newest = function (r) {
            return r.scenes.reduce(function (max, s) { return Math.max(max, s.savedAt || 0); }, 0);
          };
          live.sort(function (a, b) { return newest(b) - newest(a); });
          app = live[0].base;
          // Say so when there was a choice. A second server is not an error, but
          // silently picking one of them is how the wrong game gets played for an
          // hour without anybody suspecting the launcher.
          if (live.length > 1) {
            staleNote =
              'Found ' + live.length + ' dev servers. Using ' + app +
              ' — its scene was saved most recently.';
          }
          return live[0].scenes;
        });
      }

      function ago(ms) {
        if (!ms) return 'never saved';
        var m = Math.round((Date.now() - ms) / 60000);
        if (m < 1) return 'just saved';
        if (m < 60) return m + ' min ago';
        var h = Math.round(m / 60);
        return h < 24 ? h + ' hr ago' : Math.round(h / 24) + ' days ago';
      }

      var wanted = params.get('start');
      document.getElementById('title').textContent = wanted ? 'Opening ' + wanted + '…' : 'Opening…';
      document.getElementById('sub').textContent = 'Finding the game…';

      findApp()
        .then(function (scenes) {
          // Preview Scene told us exactly what to open — no need to ask or guess.
          // Still pause on a multi-server warning: opening the wrong one silently
          // is the failure this whole function exists to stop.
          if (wanted) {
            if (staleNote) {
              document.getElementById('sub').textContent = staleNote;
              setTimeout(function () { location.replace(runUrl(wanted)); }, 1600);
            } else {
              location.replace(runUrl(wanted));
            }
            return;
          }
          var runnable = scenes.filter(function (s) { return s.compiled; });
          if (!runnable.length) throw new Error('no saved scenes');

          var newest = runnable[0];
          document.getElementById('title').textContent = 'Opening ' + newest.name + '…';
          document.getElementById('sub').textContent =
            staleNote || 'Most recently saved. Pick another to switch.';

          var ul = document.getElementById('list');
          scenes.forEach(function (s, i) {
            var li = document.createElement('li');
            var a = document.createElement('a');
            a.className =
              'scene' + (i === 0 && s.compiled ? ' newest' : '') + (s.compiled ? '' : ' stale');
            a.href = s.compiled ? runUrl(s.name) : '#';
            a.innerHTML =
              '<span>' + s.name + '</span><span class="when">' + ago(s.savedAt) + '</span>';
            li.appendChild(a);
            ul.appendChild(li);
          });

          document.getElementById('help').innerHTML =
            'Tip: <b>Ctrl+0</b> in the Editor opens whichever scene you are editing, directly.' +
            '<br>A scene only appears here once it has been <b>saved</b>.';

          // Long enough to notice the list and click something else.
          setTimeout(function () { location.replace(runUrl(newest.name)); }, 1200);
        })
        .catch(function () {
          document.getElementById('title').textContent = 'Cannot reach the game';
          document.getElementById('sub').innerHTML =
            'The Vite dev server has to be running:<br><code>cd card-engine &amp;&amp; npm run dev</code>';
          document.getElementById('help').innerHTML =
            'Looked on ports <code>' + ports.join(', ') + '</code>. ' +
            'Somewhere else? Add <code>?port=1234</code>.';
        });
    </script>
  </body>
</html>
